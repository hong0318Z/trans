<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT Generator - 텍스트 파일 생성기</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .generator-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .format-guide {
      background: #1a2a4e;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      border-left: 4px solid #3a7bd5;
    }

    .format-guide h3 {
      color: #3a7bd5;
      margin-bottom: 10px;
    }

    .format-guide code {
      background: #0f0f23;
      padding: 3px 8px;
      border-radius: 4px;
      color: #00d2ff;
    }

    .format-guide .example {
      background: #0f0f23;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-family: monospace;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    #inputText {
      width: 100%;
      min-height: 200px;
      padding: 15px;
      font-size: 1rem;
      font-family: monospace;
      border: 2px solid #333;
      border-radius: 10px;
      background: #0f0f23;
      color: #fff;
      resize: vertical;
      margin-bottom: 15px;
    }

    #inputText:focus {
      outline: none;
      border-color: #3a7bd5;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn-group button {
      flex: 1;
      padding: 15px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-parse {
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      color: white;
    }

    .btn-download-all {
      background: #27ae60;
      color: white;
    }

    .btn-clear {
      background: #333;
      color: #888;
      flex: 0.5;
    }

    .btn-group button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .btn-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .preview-section {
      margin-top: 20px;
    }

    .preview-section h2 {
      color: #3a7bd5;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-count {
      background: #3a7bd5;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .file-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .file-item {
      background: #0f0f23;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #333;
      transition: all 0.2s;
    }

    .file-item:hover {
      border-color: #3a7bd5;
    }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .file-name {
      font-weight: bold;
      color: #00d2ff;
      font-size: 1.1rem;
    }

    .file-name::after {
      content: '.txt';
      color: #666;
      font-weight: normal;
    }

    .file-content {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #ccc;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .file-actions button {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-download {
      background: #3a7bd5;
      color: white;
    }

    .btn-copy {
      background: #333;
      color: #aaa;
    }

    .btn-delete {
      background: #ff4757;
      color: white;
      flex: 0.5;
    }

    .file-actions button:hover {
      opacity: 0.9;
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #3a7bd5;
      text-decoration: none;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .empty-preview {
      text-align: center;
      padding: 50px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container generator-container">
    <a href="index.html" class="nav-link">← 번역 동기화로 돌아가기</a>

    <header>
      <h1>TXT Generator</h1>
      <p class="subtitle">텍스트 파일 일괄 생성기</p>
    </header>

    <div class="format-guide">
      <h3>입력 형식</h3>
      <p><code>파일이름 - 내용</code> 형식으로 입력, <code>;</code>로 구분</p>
      <div class="example">기본 - soft smile, gentle expression, looking at viewer;웃음 - smiling, happy expression;슬픔 - sad expression, tears</div>
    </div>

    <textarea id="inputText" placeholder="파일이름 - 내용;파일이름2 - 내용2;..."></textarea>

    <div class="btn-group">
      <button class="btn-parse" id="parseBtn">파일 생성하기</button>
      <button class="btn-download-all" id="downloadAllBtn" disabled>전체 다운로드 (ZIP)</button>
      <button class="btn-clear" id="clearBtn">초기화</button>
    </div>

    <div class="preview-section">
      <h2>
        미리보기
        <span class="file-count" id="fileCount">0개</span>
      </h2>
      <div class="file-list" id="fileList">
        <div class="empty-preview">파일이 생성되면 여기에 표시됩니다</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- JSZip CDN for ZIP download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="txt-generator.js"></script>
</body>
</html>
